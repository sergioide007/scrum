<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050a14">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96x96.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/icons/site.webmanifest">
<title>Board — Scrum / SDD | Alpaquitay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://www.specsolid.com/shared/specsolid-search.css">
</head>
<body>

<!-- NAV -->
<nav>
  <a href="./" class="nav-brand">▲ SCRUM / SDD</a>
  <a href="./" class="nav-btn active">Board</a>
  <a href="backlog/" class="nav-btn">Backlog</a>
  <a href="metricas/" class="nav-btn">Métricas</a>
  <a href="planning/" class="nav-btn">Planning</a>
  <div class="nav-spacer"></div>
  <a href="alpaquitay/" class="aq-badge" id="aqBadge">
    <div class="aq-dot" id="aqDot"></div>
    <span id="aqLabel">Alpaquitay</span>
  </a>
</nav>

<!-- PAGE: BOARD -->
<div id="page-board" class="page active">
  <div class="container">
    <div class="sprint-hd">
      <div>
        <h2 id="sprintName">—</h2>
        <p id="sprintGoal">—</p>
      </div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div class="sprint-stats" id="sprintStats"></div>
        <button class="btn btn-sm btn-o" onclick="openModal('sprint')">+ Sprint</button>
        <button class="btn btn-sm btn-p" onclick="openModal('task',null,'todo')">+ Tarea</button>
      </div>
    </div>
    <div class="board" id="board"></div>
  </div>
</div>

<!-- MODAL: TASK -->
<div class="overlay" id="taskOverlay">
  <div class="modal">
    <h3 id="taskModalTitle">Nueva Historia</h3>
    <div class="frow">
      <div class="fg"><label class="fl">Tipo</label>
        <select class="fs" id="tType">
          <option value="feature">Feature</option>
          <option value="bug">Bug</option>
          <option value="tech">Tech Debt</option>
          <option value="spike">Spike</option>
        </select>
      </div>
      <div class="fg"><label class="fl">Prioridad</label>
        <select class="fs" id="tPriority">
          <option value="critical">Critical</option>
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
    </div>
    <div class="fg"><label class="fl">Título</label><input class="fi" id="tTitle" placeholder="Como usuario quiero..."></div>
    <div class="fg"><label class="fl">Descripción</label><textarea class="ft" id="tDesc" placeholder="Contexto, restricciones, notas técnicas..."></textarea></div>
    <div class="frow">
      <div class="fg"><label class="fl">Puntos (Fibonacci)</label>
        <select class="fs" id="tPoints">
          <option value="1">1</option><option value="2">2</option>
          <option value="3">3</option><option value="5" selected>5</option>
          <option value="8">8</option><option value="13">13</option>
          <option value="21">21</option>
        </select>
      </div>
      <div class="fg"><label class="fl">Asignar a</label>
        <select class="fs" id="tAssignee"></select>
      </div>
    </div>
    <div class="fg"><label class="fl">Epic</label>
      <select class="fs" id="tEpic"><option value="">Sin epic</option></select>
    </div>
    <div class="fg"><label class="fl">Criterios de aceptación</label>
      <textarea class="ft" id="tAC" placeholder="✅ Dado... cuando... entonces...&#10;✅ El sistema debe..."></textarea>
    </div>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn btn-sm btn-ai" onclick="aqEstimate()">✦ Estimar con AI</button>
      <button class="btn btn-sm btn-ai" onclick="aqRefineTask()">✦ Refinar historia</button>
    </div>
    <div class="mf">
      <button class="btn btn-o" onclick="closeModal('taskOverlay')">Cancelar</button>
      <button class="btn btn-p" onclick="saveTask()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL: SPRINT -->
<div class="overlay" id="sprintOverlay">
  <div class="modal">
    <h3>Configurar Sprint</h3>
    <div class="fg"><label class="fl">Nombre del sprint</label><input class="fi" id="sName" placeholder="Sprint 3"></div>
    <div class="fg"><label class="fl">Objetivo del sprint</label><textarea class="ft" id="sGoal" placeholder="Al final de este sprint..."></textarea></div>
    <div class="frow">
      <div class="fg"><label class="fl">Inicio</label><input type="date" class="fi" id="sStart"></div>
      <div class="fg"><label class="fl">Fin</label><input type="date" class="fi" id="sEnd"></div>
    </div>
    <div class="fg"><label class="fl">Capacidad (pts)</label><input type="number" class="fi" id="sCapacity" value="40"></div>
    <div class="mf">
      <button class="btn btn-o" onclick="closeModal('sprintOverlay')">Cancelar</button>
      <button class="btn btn-p" onclick="saveSprint()">Activar Sprint</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
window.SpecSearch = {
  site: 'scrum',
  lang: 'es',
  topics: ['Sprint Planning','Backlog','Kanban Board','Story Points','Velocity','Scrum Master','Retrospective','Definition of Done','User Story'],
};
</script>
<script src="https://www.specsolid.com/shared/specsolid-search.js" defer></script>
<script src="data.js"></script>
<script>
initState();
AQ.init();
renderBoard();
document.querySelectorAll('.overlay').forEach(ov => {
  ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('open'); });
});
</script>
</body>
</html>
